user  nobody;
worker_processes  4;

error_log /data/user/0/ru.kslabs.ksweb/components/log/nginx/nginx.log;
pid /data/user/0/ru.kslabs.ksweb/components/log/nginx/nginx.pid;

#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/error.log;


events {
    worker_connections  1024;
}


http {

	large_client_header_buffers 4 16k;

access_log /data/user/0/ru.kslabs.ksweb/components/log/nginx/access.log;

    include       /data/data/ru.kslabs.ksweb/components/nginx/conf/mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;

    # 全局开启目录浏览
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

	#client_max_body_size 20M;
	
#begin_hosts (do not remove this label!)
