如何浏览目录
由于已开启 autoindex on，当访问的目录中没有默认首页文件时，Nginx 会自动展示该目录的文件列表。您可以通过以下几种方式浏览目录：

方式一：访问无首页文件的目录

在 /var/www/html 下创建一个无首页文件的子目录，例如：

BASH

mkdir /var/www/html/files

然后访问 http://81.xx.176.xx/files/，即可看到目录浏览界面。

方式二：删除或重命名当前首页文件

将现有的 index.php 和 index.html 临时移走后，直接访问 http://81.xx.176.xx/ 即可浏览根目录文件列表：

BASH

mv /var/www/html/index.php /var/www/html/index.php.bak
mv /var/www/html/index.html /var/www/html/index.html.bak

访问 http://81.xx.176.xx/ 即可看到根目录下的文件列表。恢复首页只需将文件移回即可。

方式三：新建测试目录并放入文件

BASH

mkdir -p /var/www/html/share
echo "test file" > /var/www/html/share/test.txt

然后访问 http://81.xx.176.xx/share/，即可看到该目录下的文件列表，并可直接点击下载文件。

注意：目录浏览会暴露服务器文件结构，建议仅在内部使用或配合访问控制，生产环境请谨慎开启。



